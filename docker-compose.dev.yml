# Local development data layer for KnowledgeGraph AI.
# Both services bind to 127.0.0.1 only; never expose these ports on 0.0.0.0.
# Credentials are read from .env, which is gitignored.
#
#   docker compose -f docker-compose.dev.yml up -d
#
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledgegraph}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kg_pg_data:/var/lib/postgresql/data
      # Applied only on first initialization of an empty volume.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5.25-community
    container_name: kg-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Keep the "fully local" promise: disable Neo4j usage telemetry.
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - kg_neo4j_data:/data
      - kg_neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

volumes:
  kg_pg_data:
  kg_neo4j_data:
  kg_neo4j_logs:
