[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Unit tests (fast, no external services)
    integration: Integration tests (may require local services)
    evaluation: Deterministic GraphRAG evaluation suite (no external services)
    live: Live end-to-end tests against a running stack (requires KG_LIVE=1)
    slow: Slow tests
asyncio_mode = auto
